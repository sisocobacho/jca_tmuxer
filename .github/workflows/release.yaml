name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            build: native
          - target: aarch64-unknown-linux-musl
            build: docker

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        if: matrix.build == 'native'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.build == 'native'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build native target
        if: matrix.build == 'native'
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Build docker target
        if: matrix.build == 'docker'
        run: |
          docker run --rm \
            -v "$PWD:/home/rust/src" \
            -w /home/rust/src \
            messense/rust-musl-cross:aarch64-musl \
            cargo build --locked --release --target ${{ matrix.target }}

      - name: Package binary
        run: |
          asset_name="jca_tmuxer-${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/jca_tmuxer" ./jca_tmuxer
          tar -czf "${asset_name}.tar.gz" jca_tmuxer

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: jca_tmuxer-${{ matrix.target }}.tar.gz

  publish:
    name: Publish release assets
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.tar.gz > checksums.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/checksums.txt
          generate_release_notes: true
